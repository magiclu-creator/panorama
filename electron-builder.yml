appId: com.panorama.app
productName: 全景
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  publish:
    - provider: github
      owner: magiclu-creator
      repo: panorama
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: 全景
  uninstallDisplayName: 全景
  createDesktopShortcut: always
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
linux:
  target:
    - AppImage
    - deb
  category: Office
publish:
  provider: github
  owner: magiclu-creator
  repo: panorama
